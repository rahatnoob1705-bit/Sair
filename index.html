<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Ван Пис Карточки</title>
    
    <style>
      body {
        background-image: url('Images/ONEPIECE.jpg');
        background-size: cover;
        background-attachment: fixed;
        background-color: #222;
        margin: 0;
        text-align: center;
      }
      .card {
        border: 2px solid gold;
        width: 250px;
        margin: 20px;
        padding: 15px;
        display: inline-block;
        vertical-align: top;
        background-color: rgba(255, 255, 255, 0.9);
        border-radius: 15px;
      }
      .jinbe-card {
        border: 3px solid blue;
        width: 400px;
        margin: 50px auto;
        padding: 20px;
        background-color: white;
        border-radius: 20px;
      }
      p { font-family: sans-serif; font-weight: bold; }
      img { border-radius: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <img src="Images/LuffyGPT.jpg" width="180px">
        <p>Луффи - капитан корабля.</p>
        <a href="https://onepiece.fandom.com/ru/wiki/Монки_Д._Луффи" target="_blank">Ссылка</a>
    </div>

    <div class="card">
        <img src="Images/ZoroGPT.jpg" width="180px">
        <p>Зоро - мастер трех мечей.</p>
        <a href="https://onepiece.fandom.com/ru/wiki/Ророноа_Зоро" target="_blank">Ссылка</a>
    </div>

    <div class="card">
        <img src="Images/NamiGPT.jpg" width="180px">
        <p>Нами - лучший навигатор.</p>
        <a href="https://onepiece.fandom.com/ru/wiki/Нами" target="_blank">Ссылка</a>
    </div>

    <div class="jinbe-card">
        <img src="Images/jinbe_figure.jpg" width="300px">
        <p>Моя коллекция: Фигурка Дзимбэя</p>
    </div>

</body>
</html>
