<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ван Пис Карточки</title>
    
    <style>
      /* === НАСТРОЙКИ КУРСОРА НА ВСЕЙ СТРАНИЦЕ === */
      body {
        /* Твой фон... */
        background-image: url('Images/ONEPIECE.jpg');
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
        background-color: #1a1a1a;
        margin: 0;
        padding: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        color: #fff;
        
        /* === ДОБАВЛЯЕМ ПЕРЕВЕРНУТЫЙ МЕЧ ЗОРО В КАЧЕСТВЕ КУРСОРА === */
        /* Мы указываем '0 0', чтобы активная точка клика была на острие клинка (левый верхний угол) */
        cursor: url('Images/cursor_zoro.png') 0 0, auto;
      }

      /* === УБЕДИМСЯ, ЧТО МЕЧ ВЫГЛЯДИТ ОСТРЫМ (ДЛЯ ПИКСЕЛЬ-АРТА) === */
      body * {
        image-rendering: pixelated;
      }

      /* Чтобы при наведении на кнопки курсор становился стандартным pointer-ом */
      a, button {
        cursor: pointer;
      }

      h1 {
        text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        margin-bottom: 10px;
      }

      /* Общий контейнер для карточек персонажей */
      .container {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
        max-width: 1200px;
        margin-left: auto;
        margin-right: auto;
      }

      .card {
        background: rgba(255, 255, 255, 0.95);
        border: 2px solid gold;
        border-radius: 20px;
        padding: 15px;
        width: 220px;
        color: #333;
        box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        transition: all 0.4s ease;
        animation: fadeInUp 0.8s ease-out;
        box-sizing: border-box;
      }

      .card:hover {
        transform: translateY(-15px) scale(1.05);
        box-shadow: 0 15px 30px rgba(255, 215, 0, 0.4);
        border-color: #ff4500;
      }

      .card img {
        border-radius: 12px;
        width: 100%;
        height: 250px;
        object-fit: cover;
      }

      .card p {
        font-weight: bold;
        font-size: 1.1em;
        margin: 10px 0;
      }

      .btn {
        display: inline-block;
        padding: 8px 20px;
        background-color: #ff4500;
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-size: 0.9em;
      }

      /* === СТИЛИ СЛАЙДЕРА КОЛЛЕКЦИИ === */
      .slider-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 20px;
        margin: 40px auto;
        max-width: 600px;
      }

      .jinbe-card {
        background: white;
        border: 4px solid #0056b3;
        border-radius: 25px;
        padding: 20px;
        width: 400px;
        color: #333;
        box-shadow: 0 15px 40px rgba(0,0,0,0.6);
        box-sizing: border-box;
        display: none; /* Скрываем все по умолчанию */
      }

      .jinbe-card.active {
        display: block; /* Показываем только активный слайд */
        animation: slideIn 0.5s ease-out;
      }

      .jinbe-card img {
        border-radius: 15px;
        width: 100%;
        height: 300px;
        object-fit: contain;
        background-color: #f0f0f0;
      }

      /* Кнопки слайдера */
      .slider-btn {
        background: rgba(0, 0, 0, 0.7);
        color: gold;
        border: 2px solid gold;
        font-size: 24px;
        width: 50px;
        height: 50px;
        cursor: pointer;
        border-radius: 50%;
        transition: 0.3s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .slider-btn:hover {
        background: gold;
        color: black;
      }

      @keyframes slideIn {
        from { opacity: 0; transform: translateX(20px); }
        to { opacity: 1; transform: translateX(0); }
      }

      @keyframes fadeInUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 768px) {
        .card { width: 100%; max-width: 300px; }
        .jinbe-card { width: 100%; max-width: 90%; }
        .slider-wrapper { gap: 10px; }
      }
    </style>
</head>
<body>

    <h1>🏴‍☠️ Моя Пиратская Команда 🏴‍☠️</h1>

    <div class="container">
        <div class="card"><img src="Images/LuffyGPT.jpg" alt="Луффи"><p>Монки Д. Луффи</p><a href="https://onepiece.fandom.com/ru/wiki/Монки_Д._Луффи" class="btn" target="_blank">Капитан</a></div>
        <div class="card" style="animation-delay: 0.1s;"><img src="Images/ZoroGPT.jpg" alt="Зоро"><p>Ророноа Зоро</p><a href="https://onepiece.fandom.com/ru/wiki/Ророноа_Зоро" class="btn" target="_blank">Мечник</a></div>
        <div class="card" style="animation-delay: 0.2s;"><img src="Images/NamiGPT.jpg" alt="Нами"><p>Нами</p><a href="https://onepiece.fandom.com/ru/wiki/Нами" class="btn" target="_blank">Навигатор</a></div>
        <div class="card" style="animation-delay: 0.3s;"><img src="Images/UsoppGPT.jpg" alt="Усопп"><p>Усопп</p><a href="https://onepiece.fandom.com/ru/wiki/Усопп" class="btn" target="_blank">Снайпер</a></div>
        <div class="card" style="animation-delay: 0.4s;"><img src="Images/ChopperGPT.jpg" alt="Чоппер"><p>Тони Тони Чоппер</p><a href="https://onepiece.fandom.com/ru/wiki/Тони_Тони_Чоппер" class="btn" target="_blank">Врач</a></div>
        <div class="card" style="animation-delay: 0.5s;"><img src="Images/RobinGPT.jpg" alt="Робин"><p>Нико Робин</p><a href="https://onepiece.fandom.com/ru/wiki/Нико_Робин" class="btn" target="_blank">Археолог</a></div>
    </div>

    <h1>💎 Моя коллекция фигурок</h1>
    
    <div class="slider-wrapper">
        <button class="slider-btn" onclick="moveSlide(-1)">&#10094;</button>

        <div id="slider-content">
            <div class="jinbe-card active"><h2>Дзимбэй</h2><img src="Images/jinbe_figure.jpg" alt="Дзимбэй"><p>Рыбочеловек, рулевой команды.</p></div>
            <div class="jinbe-card" style="border-color: gold;"><h2 style="color: #b8860b;">Зоро (Wano)</h2><img src="Images/ZoroFigurka.jpg" alt="Зоро Фигурка" style="border-color: gold;"><p>Мастер трёх мечей в стиле Вано.</p></div>
        </div>

        <button class="slider-btn" onclick="moveSlide(1)">&#10095;</button>
    </div>

    <script>
      let currentSlide = 0;
      const slides = document.querySelectorAll('.jinbe-card');

      function moveSlide(step) {
        slides[currentSlide].classList.remove('active');
        currentSlide = (currentSlide + step + slides.length) % slides.length;
        slides[currentSlide].classList.add('active');
      }
    </script>

</body>
</html>
